name: Build and Push to Docker Hub
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.IFFALO }}
          password: ${{ secrets.dckr_pat_g0LSKebIx3CJL9_XlajJ2NU5jEc }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.IFFALO }}/voting-app:latest
